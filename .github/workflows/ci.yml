name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A browser that hangs on launch takes the whole job with it, and the
    # default ceiling is six hours. The suite runs in under two minutes;
    # fifteen is generous and fails fast when it is not.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # TEMPORARY: tracing why the browser never launches on the runner.
          DEBUG: pw:browser*,pw:webserver

      - run: pnpm build
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-zip
          path: .output/*.zip
